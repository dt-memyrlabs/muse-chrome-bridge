<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Muse Chrome Bridge</title>
<style>
  :root { --fg:#16181d; --muted:#6b7280; --line:#e5e7eb; --bg:#fff; --accent:#2563eb; --warn:#b45309; --warnbg:#fffbeb; --danger:#b91c1c; --ok:#15803d; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8eaed; --muted:#9aa0a6; --line:#3c4043; --bg:#202124; --warnbg:#3b2f14; } }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.45 system-ui, "Segoe UI", sans-serif; color:var(--fg); background:var(--bg); }
  header { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  header h1 { font-size:14px; margin:0; flex:1; }
  .dot { width:8px; height:8px; border-radius:50%; background:#9aa0a6; }
  .dot.on { background:var(--ok); }
  section { padding:12px 14px; border-bottom:1px solid var(--line); }
  h2 { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  button { font:inherit; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--fg); padding:7px 12px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--danger); }
  button:disabled { opacity:.5; cursor:default; }
  .site { font-weight:600; word-break:break-all; }
  .muted { color:var(--muted); font-size:12px; }
  .code { font:600 26px/1.2 ui-monospace, Consolas, monospace; letter-spacing:.18em; margin:8px 0 4px; user-select:all; }
  .prompt { border:1px solid #f0c36d; background:var(--warnbg); border-radius:10px; padding:10px; margin-bottom:8px; }
  .prompt .who { font-size:11px; color:var(--warn); font-weight:600; }
  .prompt .title { font-weight:600; margin:2px 0; }
  .prompt .detail { word-break:break-word; }
  .row { display:flex; gap:8px; align-items:center; margin-top:8px; }
  .chat { display:flex; align-items:center; gap:8px; padding:6px 0; }
  .liveview { width:100%; display:block; border:1px solid var(--line); border-radius:8px; margin-top:6px; }
  .chat .name { flex:1; font-weight:600; }
  .chat-head .name { flex:1; font-weight:600; }
  .sites { margin-top:4px; }
  .site-row { display:flex; align-items:center; gap:6px; padding:2px 0; }
  .site-row .site-name { flex:1; word-break:break-all; }
  button.site-remove { padding:2px 7px; line-height:1; }
  .log div { padding:3px 0; border-bottom:1px dotted var(--line); font-size:12px; }
  input[type=text] { font:inherit; flex:1; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); font-size:12px; }
  .copied { color:var(--ok); font-weight:600; margin:2px 0 0; min-height:1em; }
  .picks { display:flex; flex-direction:column; gap:8px; margin:8px 0; }
  .picks button { width:100%; text-align:left; padding:12px 14px; border-radius:12px; border-width:2px; }
  .picks button .who { display:block; font-size:20px; font-weight:700; line-height:1.2; }
  .picks button small { display:block; font-size:12px; margin-top:2px; opacity:.85; }
  .picks.secondary button { padding:8px 12px; border-width:1px; border-radius:8px; }
  .picks.secondary button .who { font-size:14px; }
  .label { font-size:15px; font-weight:700; margin:12px 0 2px; }
  button.link { border:none; padding:4px 0; color:var(--accent); text-decoration:underline; background:none; }
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><h1>Muse Chrome Bridge</h1><span class="muted" id="relayState">connecting…</span></header>

<section id="promptsSection" hidden>
  <h2>Waiting for you</h2>
  <div id="prompts"></div>
</section>

<section>
  <h2>This tab</h2>
  <div id="page"></div>
</section>

<section>
  <h2>Your chats</h2>
  <div id="chats"></div>
</section>

<section>
  <h2>Helpers</h2>
  <div id="helpers"></div>
</section>

<section>
  <h2>Saved prompts</h2>
  <div id="savedPrompts"></div>
</section>

<section>
  <details>
    <summary>Recent activity</summary>
    <div class="log" id="log"></div>
  </details>
</section>

<script src="sidepanel.js"></script>
</body>
</html>
